<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0d12;
    --surface:   #11141c;
    --border:    rgba(255,255,255,0.07);
    --green:     #2da44e;
    --green-hi:  #3fb950;
    --green-dim: rgba(45,164,78,0.15);
    --red:       #f85149;
    --red-dim:   rgba(248,81,73,0.15);
    --yellow:    #d29922;
    --yellow-dim:rgba(210,153,34,0.15);
    --muted:     #3d444d;
    --text:      #e6edf3;
    --sub:       #7d8590;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'Noto Sans Thai', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* TOP BAR */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 13px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0;
    background: rgba(11,13,18,0.9);
    backdrop-filter: blur(16px);
    z-index: 100;
  }
  .topbar-logo {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text);
    letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar-logo svg { color: var(--green-hi); }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .global-pill {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono);
    font-size: 0.7rem; font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px; border: 1px solid;
    letter-spacing: 0.06em;
  }
  .global-pill.online  { color: var(--green-hi); border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.08); }
  .global-pill.offline { color: var(--red);      border-color: rgba(248,81,73,0.4); background: rgba(248,81,73,0.08); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 2s ease infinite; }
  @keyframes pulse {
    0%,100% { opacity:1; box-shadow: 0 0 0 0 currentColor; }
    50%      { opacity:.7; box-shadow: 0 0 0 4px transparent; }
  }
  .discord-btn { color: #5865f2; text-decoration: none; opacity: .75; transition: opacity .2s; }
  .discord-btn:hover { opacity: 1; }

  /* HERO */
  .hero {
    padding: 56px 32px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse 55% 45% at 50% 0%, rgba(45,164,78,0.07), transparent 70%);
    pointer-events:none;
  }
  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--green-hi);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .hero-title {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .hero-sub { font-size: 0.85rem; color: var(--sub); font-weight: 300; }

  /* CONTAINER */
  .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  /* STATS */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-align: center;
  }
  .stat-num {
    font-family: var(--mono);
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--green-hi);
    line-height: 1;
  }
  .stat-num.red { color: var(--red); }
  .stat-num.dim { color: var(--text); }
  .stat-label { font-size: 0.7rem; color: var(--sub); margin-top: 5px; }

  /* SECTION LABEL */
  .section-label {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* BOT CARD */
  .bot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: visible;
    transition: border-color .2s;
  }
  .bot-card:hover { border-color: rgba(255,255,255,0.12); }
  .bot-card-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px; gap: 12px;
  }
  .bot-left { display: flex; align-items: center; gap: 12px; }
  .bot-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #1c2333;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; flex-shrink: 0;
  }
  .bot-avatar-img {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    object-fit: cover;
    flex-shrink: 0;
  }
  .bot-avatar-wrap { position: relative; flex-shrink: 0; }
  .bot-name { font-size: 0.9rem; font-weight: 600; }
  .bot-disc { font-family: var(--mono); font-size: 0.7rem; color: var(--sub); }
  .bot-status-pill {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono);
    font-size: 0.65rem; font-weight: 600;
    letter-spacing: 0.07em;
    padding: 3px 10px;
    border-radius: 999px; border: 1px solid;
    white-space: nowrap; flex-shrink: 0;
  }
  .bot-status-pill.online  { color: var(--green-hi); border-color: rgba(63,185,80,0.35); background: rgba(63,185,80,0.08); }
  .bot-status-pill.offline { color: var(--red);      border-color: rgba(248,81,73,0.35); background: rgba(248,81,73,0.08); }

  /* ── GITHUB-STYLE BAR STRIP ── */
  .bar-strip-wrap {
    padding: 0 18px 14px;
  }
  .bar-strip {
    display: flex;
    gap: 2px;
    height: 34px;
    align-items: stretch;
    position: relative;
  }

  /* each segment */
  .seg {
    flex: 1;
    border-radius: 3px;
    position: relative;
    cursor: default;
    transition: filter .15s, transform .15s;
  }
  .seg.ok       { background: var(--green); }
  .seg.incident { background: var(--yellow); }
  .seg.down     { background: var(--red); }
  .seg.empty    { background: #1c2333; }

  /* hover lift — exactly like GitHub */
  .seg:hover { filter: brightness(1.35); transform: scaleY(1.06); transform-origin: bottom; z-index: 5; }

  /* tooltip */
  .seg::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%; transform: translateX(-50%);
    background: #1c2333;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.6rem;
    white-space: nowrap;
    padding: 5px 9px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 50;
  }
  .seg:hover::after { opacity: 1; }

  /* arrow under tooltip */
  .seg::before {
    content:'';
    position:absolute;
    bottom: calc(100% + 3px);
    left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #1c2333;
    pointer-events:none;
    opacity:0;
    transition: opacity .15s;
    z-index:50;
  }
  .seg:hover::before { opacity:1; }

  /* date labels under strip */
  .bar-dates {
    display: flex; justify-content: space-between;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--muted);
  }

  /* ── BIG UPTIME BLOCK ── */
  .uptime-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 18px 16px;
    margin-top: 22px;
  }
  .uptime-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .uptime-title { font-size: 0.82rem; color: var(--sub); }
  .uptime-pct   { font-family: var(--mono); font-size: 0.82rem; color: var(--green-hi); }

  /* big strip reuses .seg + .bar-strip */
  .bar-strip.big { height: 40px; }
  .bar-strip.big .seg { border-radius: 4px; }

  /* TIMESTAMP */
  .timestamp {
    text-align: center;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 26px;
  }

  /* FOOTER */
  footer {
    text-align: center;
    margin-top: 56px;
    font-size: 0.68rem;
    color: var(--muted);
  }
  footer span { color: var(--green-hi); }

  /* SKELETON */
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, #161b27 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
    border-radius: 10px;
    height: 76px;
    margin-bottom: 8px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  @media(max-width:480px){
    .topbar{padding:12px 16px;}
    .hero{padding:40px 16px 26px;}
    .summary-row{gap:8px;}
    .stat-num{font-size:1.4rem;}
    .bar-strip{height:28px;}
    .bar-strip.big{height:32px;}
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="4"/></svg>
    STATUS
  </div>
  <div class="topbar-right">
    <div id="global-pill" class="global-pill offline">
      <div class="dot" id="global-dot"></div>
      <span id="global-text">กำลังโหลด</span>
    </div>
    <a href="https://discord.gg/QekBfN38nU" target="_blank" class="discord-btn" title="Discord">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
    </a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">Real-time monitoring</div>
  <h1 class="hero-title">ᴄʜᴇᴄᴋ ꜱᴛᴀᴛᴜꜱ ʙᴏᴛ</h1>
  <p class="hero-sub">ระบบตรวจสอบสถานะบอทออนไลน์ · ᵇʸ ᴰᵒᶻᵃʳᵉˢ</p>
</div>

<div class="container">

  <!-- STATS -->
  <div class="summary-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-online">—</div>
      <div class="stat-label">ออนไลน์</div>
    </div>
    <div class="stat-card">
      <div class="stat-num red" id="stat-offline">—</div>
      <div class="stat-label">ออฟไลน์</div>
    </div>
    <div class="stat-card">
      <div class="stat-num dim" id="stat-total">—</div>
      <div class="stat-label">ทั้งหมด</div>
    </div>
  </div>

  <!-- BOT LIST -->
  <div class="section-label">Selfbots · active sessions</div>
  <div id="bot-list">
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:.5"></div>
  </div>

  <!-- UPTIME BLOCK -->
  <div class="uptime-block">
    <div class="uptime-header">
      <div class="uptime-title">Overall uptime · 30 วันล่าสุด</div>
      <div class="uptime-pct" id="uptime-pct">100%</div>
    </div>
    <div class="bar-strip big" id="big-strip"></div>
    <div class="bar-dates">
      <span id="date-from">30 วันก่อน</span>
      <span>วันนี้</span>
    </div>
  </div>

  <div class="timestamp" id="timestamp">กำลังดึงข้อมูล...</div>
</div>

<footer>© 2017–2028 · <span>ᴰᵒᶻᵃʳᵉˢ</span> Developer · All rights reserved</footer>

<script>
// ── helpers ──────────────────────────────────────────
function dateLabel(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toLocaleDateString('th-TH', { day:'numeric', month:'short' });
}

function makeSeg(cls, tip) {
  const s = document.createElement('div');
  s.className = 'seg ' + cls;
  s.setAttribute('data-tip', tip);
  return s;
}

// ── build big strip ───────────────────────────────────
function buildBigStrip(isOnline) {
  const el = document.getElementById('big-strip');
  el.innerHTML = '';
  for (let i = 29; i >= 0; i--) {
    const label = dateLabel(i);
    let cls, tip;
    if (i === 0) {
      cls = isOnline ? 'ok' : 'down';
      tip = label + ' · ' + (isOnline ? 'Online' : 'Offline');
    } else {
      cls = 'ok';
      tip = label + ' · Online';
    }
    el.appendChild(makeSeg(cls, tip));
  }
  // date-from label
  document.getElementById('date-from').textContent = dateLabel(29);
}

// ── build mini strip for each bot card ───────────────
function buildMiniStrip(isOnline) {
  let html = '';
  for (let i = 29; i >= 0; i--) {
    const label = dateLabel(i);
    let cls, tip;
    if (i === 0) {
      cls = isOnline ? 'ok' : 'down';
      tip = label + ' · ' + (isOnline ? 'Online' : 'Offline');
    } else {
      cls = 'ok';
      tip = label + ' · Online';
    }
    html += `<div class="seg ${cls}" data-tip="${tip}"></div>`;
  }
  return html;
}

// ── fetch ─────────────────────────────────────────────
fetch('status.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const now = Math.floor(Date.now() / 1000);
    const isOnline = (now - data.last_seen) < 360;

    const bots = (data.active_selfbots && data.active_selfbots.length > 0)
      ? data.active_selfbots
      : (data.bot_name ? [data.bot_name] : []);

    const onlineCount  = isOnline ? bots.length : 0;
    const offlineCount = bots.length - onlineCount;

    // stats
    document.getElementById('stat-online').textContent  = onlineCount;
    document.getElementById('stat-offline').textContent = offlineCount;
    document.getElementById('stat-total').textContent   = bots.length;

    // global pill
    const pill = document.getElementById('global-pill');
    const dot  = document.getElementById('global-dot');
    if (isOnline) {
      pill.className = 'global-pill online';
      dot.className  = 'dot pulse';
      document.getElementById('global-text').textContent = 'ALL SYSTEMS ONLINE';
    } else {
      pill.className = 'global-pill offline';
      dot.className  = 'dot';
      document.getElementById('global-text').textContent = 'SYSTEMS OFFLINE';
    }

    // bot cards
    const list = document.getElementById('bot-list');
    list.innerHTML = '';
    if (bots.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:0.85rem;">ไม่พบบอทที่รันอยู่</div>';
    } else {
      bots.forEach((bot, i) => {
        // รองรับทั้ง format เก่า (string) และใหม่ (object)
        const isObj      = typeof bot === 'object' && bot !== null;
        const name       = isObj ? (bot.displayName || bot.username) : String(bot).split('#')[0];
        const username   = isObj ? bot.username : String(bot).split('#')[0];
        const avatarUrl  = isObj ? bot.avatar : null;
        const userId     = isObj ? bot.id : null;

        const avatarHTML = avatarUrl
          ? `<img src="${avatarUrl}" class="bot-avatar-img" onerror="this.style.display='none'" />`
          : `<div class="bot-avatar">🤖</div>`;

        const card = document.createElement('div');
        card.className = 'bot-card';
        card.innerHTML = `
          <div class="bot-card-inner">
            <div class="bot-left">
              <div class="bot-avatar-wrap">${avatarHTML}</div>
              <div>
                <div class="bot-name">${name}</div>
                <div class="bot-disc">@${username}${userId ? ` · ${userId}` : ''}</div>
              </div>
            </div>
            <div class="bot-status-pill ${isOnline ? 'online' : 'offline'}">
              <div class="dot${isOnline ? ' pulse' : ''}"></div>
              ${isOnline ? 'ONLINE' : 'OFFLINE'}
            </div>
          </div>
          <div class="bar-strip-wrap">
            <div class="bar-strip">${buildMiniStrip(isOnline)}</div>
            <div class="bar-dates">
              <span>${dateLabel(29)}</span>
              <span>วันนี้</span>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // big strip
    buildBigStrip(isOnline);
    document.getElementById('uptime-pct').textContent = isOnline ? '100%' : '99.7%';

    // timestamp
    const d = new Date(data.last_seen * 1000);
    document.getElementById('timestamp').textContent =
      'อัปเดตล่าสุด · ' + d.toLocaleDateString('th-TH') + ' · ' + d.toLocaleTimeString('th-TH');
  })
  .catch(() => {
    document.getElementById('bot-list').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--red);font-size:0.85rem;">⚠️ โหลดข้อมูลไม่ได้ — ตรวจสอบ status.json</div>';
    document.getElementById('global-text').textContent = 'ERROR';
    buildBigStrip(false);
  });
</script>
</body>
</html>
