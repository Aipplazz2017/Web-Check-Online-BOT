<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My Bot Status</title>
    <style>
        body { background: #0f0f12; color: #fff; font-family: 'Kanit', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .bot-card { background: #1a1a1f; padding: 20px; border-radius: 15px; margin: 10px; width: 300px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .offline { background: #ef4444; }
    </style>
</head>
<body>
    <h1>สถานะบอททั้งหมด</h1>
    <div id="bot-container"></div>

    <script>
        fetch('status.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('bot-container');
            // สมมติไฟล์ JSON เก็บเป็นรายการ [{name: "...", status: "...", last_seen: 123}, ...]
            data.bots.forEach(bot => {
                const isOnline = (Math.floor(Date.now() / 1000) - bot.last_seen < 360);
                container.innerHTML += `
                    <div class="bot-card">
                        <span>${bot.name}</span>
                        <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
