<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0d12;
    --surface:   #11141c;
    --border:    rgba(255,255,255,0.07);
    --green:     #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --red:       #ff4d6a;
    --red-dim:   rgba(255,77,106,0.12);
    --yellow:    #ffc84a;
    --muted:     #4a5568;
    --text:      #e2e8f0;
    --sub:       #718096;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'Noto Sans Thai', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ─── TOP BAR ─── */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(11,13,18,0.85);
    backdrop-filter: blur(14px);
    z-index: 10;
  }
  .topbar-logo {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--green);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .global-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid;
    font-weight: 600;
    letter-spacing: 0.06em;
    transition: opacity 0.3s;
  }
  .global-pill.online  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
  .global-pill.offline { color: var(--red);   border-color: var(--red);   background: var(--red-dim);  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .dot.pulse {
    animation: pulse 1.8s ease infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 currentColor; opacity:1; }
    50%      { box-shadow: 0 0 0 5px transparent; opacity:0.7; }
  }
  .discord-btn {
    color: #7289da;
    font-size: 1.1rem;
    text-decoration: none;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .discord-btn:hover { opacity: 1; }

  /* ─── HERO ─── */
  .hero {
    padding: 64px 32px 40px;
    text-align: center;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0,229,160,0.06), transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--green);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .hero-title {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .hero-sub {
    font-size: 0.88rem;
    color: var(--sub);
    font-weight: 300;
  }

  /* ─── LAYOUT ─── */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ─── SUMMARY ROW ─── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    text-align: center;
  }
  .stat-num {
    font-family: var(--mono);
    font-size: 2rem;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
  }
  .stat-num.red { color: var(--red); }
  .stat-label {
    font-size: 0.72rem;
    color: var(--sub);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* ─── SECTION TITLE ─── */
  .section-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* ─── BOT CARD ─── */
  .bot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.25s;
  }
  .bot-card:hover { border-color: rgba(255,255,255,0.13); }

  .bot-card-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    gap: 12px;
  }

  .bot-left { display: flex; align-items: center; gap: 14px; }
  .bot-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a2535, #0f1620);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .bot-name-wrap {}
  .bot-name {
    font-size: 0.92rem;
    font-weight: 600;
  }
  .bot-disc {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--sub);
  }

  .bot-status-pill {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid;
    white-space: nowrap;
  }
  .bot-status-pill.online  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
  .bot-status-pill.offline { color: var(--red);   border-color: var(--red);   background: var(--red-dim);  }

  /* mini bar inside each card */
  .bot-bar-row {
    padding: 0 20px 14px;
  }
  .mini-bars {
    display: flex;
    gap: 2px;
    height: 5px;
  }
  .mini-bar {
    flex: 1;
    border-radius: 1px;
    background: var(--green);
    opacity: 0.55;
  }
  .mini-bar.last { opacity: 1; }
  .mini-bar.dead { background: var(--red); opacity: 0.8; }

  /* ─── UPTIME SECTION ─── */
  .uptime-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 20px 16px;
    margin-top: 24px;
  }
  .uptime-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .uptime-title {
    font-size: 0.82rem;
    color: var(--sub);
  }
  .uptime-pct {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--green);
  }
  .big-bars {
    display: flex;
    gap: 3px;
    height: 32px;
  }
  .big-bar {
    flex: 1;
    border-radius: 3px;
    background: var(--green);
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .big-bar:hover { opacity: 0.9; }
  .big-bar.dead { background: var(--red); opacity: 0.8; }
  .big-bar.warn { background: var(--yellow); opacity: 0.7; }
  .uptime-dates {
    display: flex; justify-content: space-between;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
  }

  /* ─── TIMESTAMP ─── */
  .timestamp {
    text-align: center;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 28px;
    letter-spacing: 0.06em;
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  footer span { color: var(--green); }

  /* ─── LOADING SKELETON ─── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, #1a1f2e 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    height: 60px;
    margin-bottom: 10px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  @media (max-width: 480px) {
    .topbar { padding: 12px 16px; }
    .hero { padding: 44px 16px 28px; }
    .summary-row { grid-template-columns: repeat(3,1fr); gap: 8px; }
    .stat-card { padding: 14px 10px; }
    .stat-num { font-size: 1.5rem; }
    .big-bars { height: 24px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">◆ Status</div>
  <div class="topbar-right">
    <div id="global-pill" class="global-pill offline">
      <div class="dot"></div>
      <span id="global-text">กำลังโหลด</span>
    </div>
    <a href="https://discord.gg/QekBfN38nU" target="_blank" class="discord-btn" title="Discord">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    </a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">Real-time monitoring</div>
  <h1 class="hero-title">ᴄʜᴇᴄᴋ ꜱᴛᴀᴛᴜꜱ ʙᴏᴛ</h1>
  <p class="hero-sub">ระบบตรวจสอบสถานะบอทออนไลน์ · ᵇʸ ᴰᵒᶻᵃʳᵉˢ</p>
</div>

<div class="container">

  <!-- STATS -->
  <div class="summary-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-online">—</div>
      <div class="stat-label">ออนไลน์</div>
    </div>
    <div class="stat-card">
      <div class="stat-num red" id="stat-offline">—</div>
      <div class="stat-label">ออฟไลน์</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">ทั้งหมด</div>
    </div>
  </div>

  <!-- BOT LIST -->
  <div class="section-label">บอท · selfbot</div>
  <div id="bot-list">
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:.6"></div>
  </div>

  <!-- UPTIME BLOCK -->
  <div class="uptime-block">
    <div class="uptime-header">
      <div class="uptime-title">สถานะย้อนหลัง 30 วัน</div>
      <div class="uptime-pct" id="uptime-pct">100%</div>
    </div>
    <div class="big-bars" id="big-bars"></div>
    <div class="uptime-dates">
      <span>30 วันก่อน</span>
      <span>วันนี้</span>
    </div>
  </div>

  <div class="timestamp" id="timestamp">กำลังดึงข้อมูล...</div>

</div>

<footer>© 2017–2028 · <span>ᴰᵒᶻᵃʳᵉˢ</span> Developer · All rights reserved</footer>

<script>
// ─── Build uptime bars ───
const bigBarsEl = document.getElementById('big-bars');
const barEls = [];
for (let i = 0; i < 30; i++) {
  const b = document.createElement('div');
  b.className = 'big-bar';
  bigBarsEl.appendChild(b);
  barEls.push(b);
}

// ─── Fetch ───
fetch('status.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const now = Math.floor(Date.now() / 1000);
    const isOnline = (now - data.last_seen) < 360;

    // bots list
    const bots = (data.active_selfbots && data.active_selfbots.length > 0)
      ? data.active_selfbots
      : (data.bot_name ? [data.bot_name] : []);

    const onlineCount  = isOnline ? bots.length : 0;
    const offlineCount = bots.length - onlineCount;

    // stats
    document.getElementById('stat-online').textContent  = onlineCount;
    document.getElementById('stat-offline').textContent = offlineCount;
    document.getElementById('stat-total').textContent   = bots.length;

    // global pill
    const pill = document.getElementById('global-pill');
    const dot  = pill.querySelector('.dot');
    if (isOnline) {
      pill.className = 'global-pill online';
      dot.className  = 'dot pulse';
      document.getElementById('global-text').textContent = 'ALL SYSTEMS ONLINE';
    } else {
      pill.className = 'global-pill offline';
      dot.className  = 'dot';
      document.getElementById('global-text').textContent = 'OFFLINE';
    }

    // bot cards
    const list = document.getElementById('bot-list');
    list.innerHTML = '';

    if (bots.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:0.85rem;">ไม่พบบอทที่รันอยู่</div>';
    } else {
      const emojis = ['🤖','🎮','🟣','🎵','⚡','🔥','💎','🌙'];
      bots.forEach((tag, i) => {
        const parts  = tag.split('#');
        const name   = parts[0];
        const disc   = parts[1] ? '#' + parts[1] : '';
        const online = isOnline;

        // mini bars for this card
        let miniBarsHTML = '';
        for (let b = 0; b < 30; b++) {
          const isLast = b === 29;
          const isDead = !online && isLast;
          miniBarsHTML += `<div class="mini-bar${isDead?' dead':''}${isLast&&online?' last':''}"></div>`;
        }

        const card = document.createElement('div');
        card.className = 'bot-card';
        card.innerHTML = `
          <div class="bot-card-inner">
            <div class="bot-left">
              <div class="bot-avatar">${emojis[i % emojis.length]}</div>
              <div class="bot-name-wrap">
                <div class="bot-name">${name}</div>
                <div class="bot-disc">${disc}</div>
              </div>
            </div>
            <div class="bot-status-pill ${online?'online':'offline'}">
              <div class="dot${online?' pulse':''}"></div>
              ${online ? 'ONLINE' : 'OFFLINE'}
            </div>
          </div>
          <div class="bot-bar-row">
            <div class="mini-bars">${miniBarsHTML}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // big uptime bars — mark last bar red if offline
    barEls.forEach((b, i) => {
      if (!isOnline && i === 29) {
        b.classList.add('dead');
      }
    });
    document.getElementById('uptime-pct').textContent = isOnline ? '100%' : '99.7%';

    // timestamp
    const d = new Date(data.last_seen * 1000);
    document.getElementById('timestamp').textContent =
      'อัปเดตล่าสุด · ' + d.toLocaleDateString('th-TH') + ' · ' + d.toLocaleTimeString('th-TH');
  })
  .catch(() => {
    document.getElementById('bot-list').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--red);font-size:0.85rem;">⚠️ โหลดข้อมูลไม่ได้ — ตรวจสอบ status.json</div>';
    document.getElementById('global-text').textContent = 'ERROR';
  });
</script>
</body>
</html>
